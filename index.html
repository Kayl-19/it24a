<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <style>
        .done {
            text-decoration: line-through;
            color: gray;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>

<body>
    <h1>Todo List</h1>

    <input type="text" id="taskInput" placeholder="Add a task" />
    <button onclick="addTask()">Add Task</button>
    <ul id="taskList"></ul>

    <script>
        function getTaskText() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();

            console.log("The input value is: " + input.value);
            return text;
        }

        function addTask() {
            const taskText = getTaskText();

            if (taskText !== "") {
                addTaskItem(taskText);
                document.getElementById('taskInput').value = "";
            }
        }

        function addTaskItem(taskText) {
            const li = document.createElement('li');
            const taskSpan = document.createElement('span');
            taskSpan.textContent = taskText + " ";
            li.appendChild(taskSpan);

            const doneBtn = createDoneButton(li);
            li.appendChild(doneBtn);

            const editBtn = createEditButton(li, taskSpan);
            li.appendChild(editBtn);

            const deleteBtn = createDeleteButton(li);
            li.appendChild(deleteBtn);

            document.getElementById('taskList').appendChild(li);
        }

        function createDoneButton(li) {
            const doneBtn = document.createElement('button');
            doneBtn.textContent = "Done";

            doneBtn.onclick = () => {
                console.log(li);
                li.classList.add("done");
                const buttons = li.querySelectorAll("button");

                buttons.forEach(btn => {
                    btn.disabled = true;
                });
                console.log("Task Completed", li.textContent, Date());
            };

            return doneBtn;
        }
        
        function createEditButton(li, taskSpan) {
            const editBtn = document.createElement("button");
            editBtn.textContent = "Edit";
            editBtn.style.marginLeft = "8px";

            editBtn.onclick = () => {
                if (li.classList.contains("done")) return;

                if (editBtn.textContent === "Edit") {
                    const currentText = taskSpan.textContent.trim();
                    const input = document.createElement("input");
                    input.type = "text";
                    input.value = currentText;

                    li.replaceChild(input, taskSpan);
                    editBtn.textContent = "Save";
                } else {
                    const input = li.querySelector("input[type='text']");
                    const newText = input.value.trim();

                    if (newText !== "") {
                        taskSpan.textContent = newText + " ";
                    }
                    li.replaceChild(taskSpan, input);
                    editBtn.textContent = "Edit";
                }
            };

            return editBtn;
        }

        function createDeleteButton(li) {
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.style.marginLeft = "8px";
            deleteBtn.onclick = () => handleDeleteClick(li);
            return deleteBtn;
        }

        function handleDeleteClick(li) {
            li.remove();
        }
    </script>
</body>

</html>
